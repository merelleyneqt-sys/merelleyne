<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merelleyne — Arrangements</title>
  <meta name="description" content="Original arrangements by Merelleyne. Listen and buy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <header class="head">
      <!-- Vinyl: put your picture next to index.html as cover.jpg — it fills the disc. -->
      <button class="cover" id="cover" aria-label="Play / pause">
        <span class="disc">
          <img class="art" src="cover.jpg" alt="" onerror="this.closest('.cover').classList.add('no-art'); this.remove()">
          <svg class="sigil" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width=".8">
              <path d="M50 8 L58 62 L50 92 L42 62 Z"/>
              <path d="M14 34 L60 44 L86 66 L40 56 Z"/>
              <path d="M86 34 L40 44 L14 66 L60 56 Z"/>
            </g>
          </svg>
          <span class="grooves"></span>
          <span class="hole"></span>
        </span>
        <span class="sheen" aria-hidden="true"></span>
        <span class="cover-play" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </span>
      </button>

      <h1 class="name">Merelleyne</h1>
      <p class="sub" id="sub"><span>Arrangements</span><span class="dot">·</span><span>Vol. 01</span></p>
    </header>

    <ol class="list" id="list"></ol>

    <footer class="foot">
      <span>Tagged previews · full stems &amp; WAV on purchase</span>
      <a href="mailto:hello@example.com">Contact&nbsp;↘</a>
    </footer>
  </main>

  <div class="player" id="player" aria-label="Player">
    <div class="ctrls">
      <button class="ctl" id="shuffle" aria-label="Shuffle" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3 1 4.3 3l2.4 4c1.3 2 2.3 3 4.3 3H21M17.5 4.5 21 7l-3.5 2.5M3 17h3.5c1.3 0 2.2-.4 3-1.2M13.5 8.2c.8-.8 1.7-1.2 3-1.2H21M17.5 14.5 21 17l-3.5 2.5"/></svg>
      </button>
      <button class="ctl" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path class="fill" d="M18 5v14L8 12zM6 5h2v14H6z"/></svg>
      </button>
      <button class="ctl big" id="toggle" aria-label="Play / pause">
        <svg viewBox="0 0 24 24"><path class="fill i-play" d="M9 6.5v11l8.5-5.5z"/><path class="fill i-pause" d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
      </button>
      <button class="ctl" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path class="fill" d="M6 5v14l10-7zM16 5h2v14h-2z"/></svg>
      </button>
      <button class="ctl" id="repeat" aria-label="Repeat" data-mode="off">
        <svg viewBox="0 0 24 24"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H19M16 4l3 3-3 3M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5M8 20l-3-3 3-3"/></svg>
        <span class="one">1</span>
      </button>
    </div>
    <div class="seek">
      <span class="t" id="tCur">0:00</span>
      <div class="track" id="track"><div class="fillbar" id="fill"><i></i></div></div>
      <span class="t" id="tDur">0:00</span>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="tracks.js"></script>
  <script src="app.js"></script>
</body>
</html>
